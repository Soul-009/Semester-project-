<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Your Character</title>
  <link rel="stylesheet" href="styles.css">
  <script src="character-select.js" defer></script>
</head>
<body>
  <header>
    <h1>Select Your Character</h1>
  </header>
  <main>
    <label class="character-select" for="character-choice">
      Character
      <select id="character-choice">
        <option value="">Choose a character</option>
        <option>D.Va</option>
        <option>Genji</option>
        <option>Mercy</option>
        <option>Reinhardt</option>
        <option>Tracer</option>
        <option>Winston</option>
      </select>
    </label>
    <div class="character-box" id="character-preview" aria-live="polite">
      Choose a character
    </div>
  </main>
  <footer>
    <a href="index.html">Back</a>
  </footer>
</body>
</html>
